<!DOCTYPE html>
<html>

<head>
  <title>Edit comment</title>
</head>

<body>
  <header style="background-color: rgb(104, 168, 197)">
    <h2>Indiedev</h2>
    {% if session.username %}
    <p>
      <b>You are logged in as {{ session.username }}.</b>
    </p>
    {% endif %}
    |<a href="/">Home</a>&nbsp|&nbsp
    <a href="/search">Search</a>&nbsp|&nbsp
    {% if session.user_id %}
    <a href="/new_announcement">Create a new post</a>&nbsp|&nbsp
    <a href="/user/{{ session.user_id }}">Your user page</a>&nbsp|&nbsp
    <a href="/logout">Log out</a>&nbsp|
    {% else %} 
    <a href="/register">Create an account</a>&nbsp|&nbsp
    <a href="/login">Login</a>&nbsp|
    {% endif %}
    <hr />
  </header>

  <h1>Edit your comment on {{ announcement.title }}</h1>

  <form action="/announcement/{{announcement.id}}/comment/{{comment.id}}/edit" method="post">
    <p>
      Comment: <br />
      <textarea name="comment" rows="10" cols="50">{{ comment.comment }}</textarea>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" name="confirm" value="Confirm changes" />
    <input type="submit" value="Cancel" />
  </form>
</body>

</html>
